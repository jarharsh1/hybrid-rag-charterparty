<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hybrid RAG Engine</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --accent:#a78bfa; --text:#e2e8f0;
      --muted:#94a3b8; --border:#334155; --user:#8b5cf6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui,-apple-system,Segoe UI,sans-serif;
      background:var(--bg); color:var(--text); display:flex; flex-direction:column; min-height:100vh; }
    header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
    header h1 { font-size:18px; margin:0; }
    .pill { font-size:12px; color:var(--muted); border:1px solid var(--border); padding:2px 8px; border-radius:999px; }
    main { flex:1; max-width:820px; width:100%; margin:0 auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
    .examples { display:flex; flex-wrap:wrap; gap:8px; }
    .examples button { background:transparent; border:1px solid var(--border); color:var(--muted); font-weight:400; font-size:13px; }
    .chat { display:flex; flex-direction:column; gap:12px; }
    .msg { padding:12px 14px; border-radius:12px; max-width:85%; line-height:1.5; }
    .msg.user { align-self:flex-end; background:var(--user); color:#120a2e; }
    .msg.bot { align-self:flex-start; background:var(--panel); border:1px solid var(--border); }
    .cites { margin-top:8px; font-size:12px; color:var(--muted); }
    .cites summary { cursor:pointer; color:var(--accent); }
    form { display:flex; gap:8px; }
    input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
      background:var(--panel); color:var(--text); font-size:15px; }
    button { padding:12px 18px; border:none; border-radius:10px; background:var(--accent); color:#120a2e; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .hint { color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <header>
    <h1>🔎 Hybrid RAG Engine</h1>
    <span class="pill" id="backend">backend: …</span>
    <span class="pill" id="chunks">index: …</span>
    <span class="pill">hybrid: BM25 + dense</span>
  </header>
  <main>
    <p class="hint">Ask about the loaded corpus (a small sample knowledge base —
      swap in your own). Hybrid retrieval fuses exact-term (BM25) and semantic
      matches; each citation shows its per-retriever ranks.</p>
    <div class="examples" id="examples">
      <button>How long do I have to request a refund?</button>
      <button>What is the SLA for priority incidents?</button>
      <button>How long is personal data retained?</button>
      <button>What are the password requirements?</button>
    </div>
    <div class="chat" id="chat"></div>
    <form id="form">
      <input id="q" placeholder="Ask about eligibility, dosing, endpoints…" autocomplete="off" />
      <button id="send" type="submit">Ask</button>
    </form>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
